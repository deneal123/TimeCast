[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timecast"
version = "0.1.0"
description = "TimeCast — переиспользуемая библиотека обучения и инференса моделей прогнозирования временных рядов"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Научный стек закреплён по версиям для взаимной совместимости.
    "numpy==1.26.4",
    "pandas==2.2.1",
    "scipy==1.13.1",
    "scikit-learn==1.5.2",
    "statsmodels==0.14.4",
    "sktime==0.34.1",
    # бэкенды моделей sktime (AutoARIMA / Prophet / TBATS)
    "pmdarima==2.0.4",
    "prophet==1.1.6",
    "tbats==1.1.3",
    "duckdb==1.1.3",
    "matplotlib==3.9.3",
    "tqdm>=4.66",
    "pydantic>=2.10",
    "requests>=2.31",
    # нейросетевые модели
    "torch>=2.0.0",
    "iTransformer==0.6.0",
    "huggingface-hub==0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
]

# Современный src-layout (PyPA): пакет находится в src/timecast.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
timecast = ["py.typed"]

# GPU-сборка torch. explicit=true гарантирует, что только torch
# резолвится с этого индекса; остальные пакеты идут на PyPI.
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["timecast"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end тесты с реальным обучением (sktime); запуск: pytest -m slow",
]
