[project]
name = "timecast-backend"
version = "0.1.0"
description = "TimeCast — FastAPI-приложение поверх библиотеки timecast"
requires-python = ">=3.10,<3.13"
dependencies = [
    "timecast",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "aiofiles>=23",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13",
    "pydantic>=2.10",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
# Скрипт выгрузки артефактов в объектное хранилище (src/script/selectel_cloud.py).
cloud = ["aiobotocore>=2.12", "botocore>=1.34"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.27",       # FastAPI TestClient
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

# Backend — приложение, а не распространяемый пакет.
[tool.uv]
package = false

# Библиотека timecast ставится из соседнего каталога (editable).
[tool.uv.sources]
timecast = { path = "../timecast", editable = true }

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "venv", "logs", "public", "src/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
pretty = true
