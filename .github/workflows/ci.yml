name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

jobs:
  library:
    name: timecast library (tests + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Install CPU torch + library + tooling
        run: |
          uv pip install --system 'torch>=2.0.0' --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system ./timecast pytest ruff
      - name: Ruff (pyflakes)
        run: ruff check timecast/src --select F
      - name: Pytest
        run: cd timecast && python -m pytest -q

  backend:
    name: backend (import smoke + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Install library + backend deps
        run: |
          uv pip install --system 'torch>=2.0.0' --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system ./timecast ruff
          uv pip install --system fastapi uvicorn python-multipart aiofiles python-dotenv pyyaml rich pydantic
      - name: Ruff (pyflakes)
        run: ruff check backend/src --select F
      - name: Import smoke
        run: cd backend && PYTHONPATH=. python -c "import src.app.server; print('backend import OK')"

  frontend:
    name: frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: CI=true npm run build

  docker:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose (dev + prod)
        run: |
          cp docker/.env.example docker/.env.dev
          cp docker/.env.example docker/.env.prod
          docker compose -f docker/docker-compose.dev.yaml --env-file docker/.env.dev config -q
          docker compose -f docker/docker-compose.yaml --env-file docker/.env.prod config -q
