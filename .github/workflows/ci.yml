name: CI

on:
  push:
    branches: [frontend]
  pull_request:
    branches: [frontend]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          CI: true
