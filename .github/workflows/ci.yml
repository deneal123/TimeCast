name: CI (integration)

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# Ветка dev содержит backend/frontend/timecast как сабмодули — здесь проверяем
# их вместе: линт обоих питон-пакетов, тесты библиотеки и smoke бэкенда (TestClient).
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install library + backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ./timecast
          pip install ruff pytest httpx fastapi uvicorn python-multipart aiofiles python-dotenv pyyaml rich pydantic

      - name: Lint (ruff)
        run: |
          ruff check timecast/src
          ruff check backend/src

      - name: Library tests (fast)
        run: pytest timecast/tests -m "not slow"

      - name: Backend smoke (TestClient)
        working-directory: backend
        run: |
          mkdir -p public data
          python -c "import logging; logging.disable(logging.CRITICAL); from fastapi.testclient import TestClient; from src.app.server import app; c = TestClient(app); assert c.get('/server/health').status_code == 200; print('backend OK')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
        env:
          CI: true
