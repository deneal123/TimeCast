# Отдача SPA-статики TimeCast. Внешний reverse-proxy (infra/nginx) проксирует API.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-фоллбэк (на случай не-hash маршрутов).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статических ассетов.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
}
